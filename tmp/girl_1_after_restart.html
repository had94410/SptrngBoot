<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆり | プロフィール</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
    <div class="container">
        <a class="brand" href="/"><img src="/images/logo.png" alt="紺の街" class="site-logo"/> 紺の街</a>
        <nav>
            <a href="/">店舗検索</a>
            <a href="/admin">管理画面</a>
        </nav>
    </div>
</header>
<main class="container">
    <section class="girl-profile">
        <div class="profile-grid">
            <div class="profile-photo">
                <picture>
                    
                    
                    <img src="https://via.placeholder.com/600x600.png?text=No+Image" alt="No image" />
                </picture>
            </div>

            <div class="profile-info">
                <h1>ゆり</h1>
                <div class="meta small">
                    <span>年齢: <strong>24</strong></span>
                    <span style="margin-left:12px;">所属店舗: <a href="/store/1">紺の街カフェ 001</a></span>
                </div>

                <div class="profile-bio" style="margin-top:12px;">
                    <h3>プロフィール</h3>
                    <p>元気で明るい</p>
                    
                </div>

                <div style="margin-top:18px;">
                    <a href="/store/1" class="button small">店舗ページへ</a>
                    <a href="/" class="button small">一覧に戻る</a>
                </div>
            </div>
        </div>
    </section>
</main>
<footer class="site-footer">
    <div class="container">&copy; 2026 紺の街</div>
</footer>
</body>
</html>
