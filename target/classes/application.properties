spring.config.import=optional:file:./.env[.properties]

# Default to local MySQL for development; can be overridden with DB_URL env var
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sptrngboot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:sptrngboot}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
server.port=${PORT:8080}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:groq/compound-mini}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.openai.system-prompt=${OPENAI_SYSTEM_PROMPT:あなたは親切で役立つアシスタントです。簡潔かつ丁寧に回答してください。}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
