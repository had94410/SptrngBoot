<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }
        .chat-shell {
            max-width: 760px;
            margin: 48px auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: white;
        }
        .chat-header h1 {
            margin: 0;
            font-size: 1.6rem;
        }
        .messages {
            min-height: 320px;
            max-height: 480px;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
        }
        .message.bot {
            align-self: flex-start;
            background: white;
            border: 1px solid #e2e8f0;
        }
        .composer {
            padding: 20px 24px 24px;
            display: flex;
            gap: 12px;
            background: white;
        }
        textarea {
            flex: 1;
            min-height: 54px;
            resize: vertical;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .badge {
            display: inline-block;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="chat-shell">
        <div class="chat-header">
            <h1>AI Chatbot</h1>
            <div class="badge">Spring Boot + OpenAI API</div>
        </div>
        <div id="messages" class="messages"></div>
        <form id="chat-form" class="composer">
            <textarea id="message" placeholder="メッセージを入力してください"></textarea>
            <button type="submit">送信</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message');
        const messages = document.getElementById('messages');

        const appendMessage = (text, side) => {
            const el = document.createElement('div');
            el.className = `message ${side}`;
            el.textContent = text;
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;
            return el;
        };

        const loadHistory = async () => {
            try {
                const response = await fetch('/api/chatbot/history');
                if (!response.ok) return;
                const history = await response.json();
                if (!history || history.length === 0) {
                    appendMessage('こんにちは！何をお手伝いできますか？', 'bot');
                    return;
                }
                history.forEach(item => {
                    const side = item.sender === 'user' ? 'user' : 'bot';
                    appendMessage(item.text, side);
                });
            } catch (error) {
                appendMessage('こんにちは！何をお手伝いできますか？', 'bot');
            }
        };

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            const statusMessage = appendMessage('考え中...', 'bot');
            try {
                const response = await fetch('/api/chatbot/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                const replyText = response.ok ? (data.reply || '応答がありませんでした。') : (data.error || 'エラーが発生しました。');
                statusMessage.textContent = replyText;
            } catch (error) {
                statusMessage.textContent = '通信エラーが発生しました。';
            }
        });

        loadHistory();
    </script>
</body>
</html>
