<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${girl.name} + ' | 編集'">在籍女の子編集</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="site-header">
    <div class="container">
        <a class="brand" th:href="@{/}">紺の街</a>
        <nav>
            <a th:href="@{/}">店舗検索</a>
            <a th:href="@{/admin}">管理画面</a>
        </nav>
    </div>
</header>
<main class="container">
    <section class="panel">
        <h1 th:text="${girl.name} + ' を編集'"></h1>
        <form th:action="@{/girls/{id}/update(id=${girl.id})}" method="post">
            <div class="field">
                <label>名前</label>
                <input type="text" name="name" th:value="${girl.name}" required />
            </div>
            <div class="field">
                <label>年齢</label>
                <input type="number" name="age" th:value="${girl.age}" />
            </div>
            <div class="field">
                <label>プロフィール</label>
                <textarea name="bio" th:text="${girl.bio}"></textarea>
            </div>
            <div class="field">
                <label>Twitter URL</label>
                <input type="text" name="twitterUrl" th:value="${girl.twitterUrl}" />
            </div>
            <div class="field">
                <label>Instagram URL</label>
                <input type="text" name="instagramUrl" th:value="${girl.instagramUrl}" />
            </div>
            <div class="field">
                <label>LINE URL</label>
                <input type="text" name="lineUrl" th:value="${girl.lineUrl}" />
            </div>
            <div class="field">
                <label>出勤情報（改行で日: 時間）</label>
                <textarea name="schedule" th:text="${girl.schedule}"></textarea>
            </div>
            <div class="card-actions">
                <button type="submit" class="button">保存</button>
                <a th:href="@{/girls/{id}(id=${girl.id})}" class="button small">戻る</a>
            </div>
        </form>
    </section>
</main>
<footer class="site-footer">
    <div class="container">&copy; 2026 紺の街</div>
</footer>
</body>
</html>
