<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約完了 | 紺の街</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header class="site-header">
    <div class="container">
        <a class="brand" th:href="@{/}">紺の街</a>
        <nav>
            <a th:href="@{/}">店舗検索</a>
            <a th:href="@{/admin}">管理画面</a>
        </nav>
    </div>
</header>
<main class="container">
<section>
    <div class="message-panel">
        <h1>予約完了</h1>
        <p th:text="${store.name} + ' の予約を受け付けました。'">予約を受け付けました。</p>
        <p>店舗から確認の連絡が入る場合があります。</p>
        <a class="button" th:href="@{/}">トップへ戻る</a>
    </div>
</section>
</main>
<footer class="site-footer">
    <div class="container">&copy; 2026 紺の街</div>
</footer>
</body>
</html>
